  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="A professional-grade typing test platform featuring real-time analytics, AI-generated texts, and progress tracking." />
    <meta property="og:title" content="TypeRacer Pro" />
    <meta property="og:description" content="A professional-grade typing test platform featuring real-time analytics, AI-generated texts, and progress tracking." />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'brand-bg': 'var(--bg-color)',
              'brand-text': 'var(--text-color)',
              'brand-primary': 'var(--primary-color)',
              'brand-active': 'var(--active-color)',
              'brand-error': 'var(--error-color)',
              'brand-subtle': 'var(--subtle-color)',
            }
          }
        }
      }
    </script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('typeracer_config_v3');
          var themeId = 'velocity-amber';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.theme) themeId = parsed.theme;
          }
          var themeColors = {
            'velocity-amber': { bg: '#141416', subtle: '#222226', text: '#a1a1aa', primary: '#f59e0b', active: '#ffffff', error: '#ef4444' },
            'midnight-dark': { bg: '#08090d', subtle: '#131622', text: '#94a3b8', primary: '#00f0ff', active: '#ffffff', error: '#ff3366' },
            'neon-racer': { bg: '#0c0a17', subtle: '#1b172e', text: '#a89fcb', primary: '#ff007f', active: '#ffffff', error: '#ff3b30' },
            'emerald-track': { bg: '#06130d', subtle: '#102419', text: '#86bca0', primary: '#10b981', active: '#ffffff', error: '#f43f5e' },
            'nordic-frost': { bg: '#181f2a', subtle: '#242e3d', text: '#94a3b8', primary: '#38bdf8', active: '#ffffff', error: '#f87171' },
            'carbon-stealth': { bg: '#111113', subtle: '#1c1c20', text: '#8f9099', primary: '#ff4444', active: '#f4f4f6', error: '#ff2222' },
            'monokai-drift': { bg: '#17181c', subtle: '#25262c', text: '#9fa1a8', primary: '#a6e22e', active: '#f8f8f2', error: '#f92672' },
            'matrix-overdrive': { bg: '#040905', subtle: '#0c1a0e', text: '#5fa86c', primary: '#00ff66', active: '#e2ffe8', error: '#ff3344' }
          };
          var t = themeColors[themeId] || themeColors['velocity-amber'];
          var root = document.documentElement;
          root.style.setProperty('--bg-color', t.bg);
          root.style.setProperty('--subtle-color', t.subtle);
          root.style.setProperty('--text-color', t.text);
          root.style.setProperty('--primary-color', t.primary);
          root.style.setProperty('--active-color', t.active);
          root.style.setProperty('--error-color', t.error);
        } catch(e) {}
      })();
    </script>
    <style>
      body {
        background-color: var(--bg-color, #18181b);
        color: var(--text-color, #a1a1aa);
      }
      /* Smooth cursor animation */
      .cursor {
        transition: left 0.1s ease, top 0.1s ease;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s infinite;
        background-color: #e2b714;
      }
    </style>

}
</script>
