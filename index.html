<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>TypeRacer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 28' fill='none'%3E%3Cpath d='M 11 5 V 18.5 C 11 20.6 12.4 22 14.5 22 H 16' fill='none' stroke='%23f59e0b' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='6.5' y1='11' x2='15.5' y2='11' stroke='%23f59e0b' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M 20.5 11 V 22' fill='none' stroke='%23f59e0b' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M 20.5 14.5 C 21.8 11.8 24.2 11 27 11.5' fill='none' stroke='%23f59e0b' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              'brand-bg': 'var(--bg-color)',
              'brand-text': 'var(--text-color)',
              'brand-primary': 'var(--primary-color)',
              'brand-active': 'var(--active-color)',
              'brand-error': 'var(--error-color)',
              'brand-subtle': 'var(--subtle-color)',
            }
          }
        }
      }
    </script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('typeracer_config_v3');
          var themeId = 'velocity-amber';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.theme) themeId = parsed.theme;
          }
          var themeColors = {
            'velocity-amber': { bg: '#18181b', subtle: '#27272a', text: '#a1a1aa', primary: '#f59e0b', active: '#fafafa', error: '#ef4444' },
            'carbon-dark': { bg: '#121212', subtle: '#1e1e1e', text: '#71717a', primary: '#38bdf8', active: '#f4f4f5', error: '#f43f5e' },
            'cyber-matrix': { bg: '#0d1117', subtle: '#161b22', text: '#7ee787', primary: '#2ea043', active: '#56d364', error: '#ff7b72' },
            'nord-frost': { bg: '#242933', subtle: '#2e3440', text: '#d8dee9', primary: '#88c0d0', active: '#eceff4', error: '#bf616a' },
            'dracula-night': { bg: '#282a36', subtle: '#44475a', text: '#6272a4', primary: '#bd93f9', active: '#f8f8f2', error: '#ff5555' },
            'synthwave-84': { bg: '#241b2f', subtle: '#262335', text: '#848bbd', primary: '#ff7edb', active: '#f92aad', error: '#fe4450' },
            'midnight-deep': { bg: '#090a0f', subtle: '#121520', text: '#5f6c80', primary: '#3b82f6', active: '#e2e8f0', error: '#ef4444' },
            'emerald-terminal': { bg: '#0b1411', subtle: '#13221d', text: '#4e8573', primary: '#10b981', active: '#a7f3d0', error: '#f87171' },
            'slate-minimal': { bg: '#0f172a', subtle: '#1e293b', text: '#94a3b8', primary: '#cbd5e1', active: '#f8fafc', error: '#f43f5e' },
            'sunset-crimson': { bg: '#1a0d13', subtle: '#28141d', text: '#9e6277', primary: '#f43f5e', active: '#ffe4e6', error: '#fb7185' }
          };
          var t = themeColors[themeId] || themeColors['velocity-amber'];
          var root = document.documentElement;
          root.style.setProperty('--bg-color', t.bg);
          root.style.setProperty('--subtle-color', t.subtle);
          root.style.setProperty('--text-color', t.text);
          root.style.setProperty('--primary-color', t.primary);
          root.style.setProperty('--active-color', t.active);
          root.style.setProperty('--error-color', t.error);
        } catch(e) {}
      })();
    </script>
    <style>
      body {
        background-color: var(--bg-color, #18181b);
        color: var(--text-color, #a1a1aa);
      }
      /* Smooth cursor animation */
      .cursor {
        transition: left 0.1s ease, top 0.1s ease;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink {
        animation: blink 1s infinite;
        background-color: #e2b714;
      }
    </style>

{
  "imports": {

}
</script>
